name: CARD-ISSUE-PIPELINE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: src/backend/venv
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create virtual environment
        run: |
          python -m venv src/backend/venv
          src/backend/venv/bin/pip install --upgrade pip

      - name: Install dependencies
        run: src/backend/venv/bin/pip install -r src/backend/requirements.txt

      - name: Run Unit Tests
        run: src/backend/venv/bin/python -m pytest src/tests/unit -v

      - name: Run Integration Tests
        run: src/backend/venv/bin/python -m pytest src/tests/integration -v

